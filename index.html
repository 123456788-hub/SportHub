<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportHub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .logo span {
      color: #38bdf8;
    }

    .search {
      padding: 11px 15px;
      border-radius: 10px;
      border: none;
      width: 230px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px 100px;
    }

    .hero {
      background: white;
      border-radius: 18px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #6b7280;
    }

    .sports {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }

    .sport {
      background: white;
      border: none;
      border-radius: 15px;
      padding: 18px 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      transition: 0.2s;
    }

    .sport:hover {
      transform: translateY(-3px);
    }

    .sport.active {
      background: #111827;
      color: white;
    }

    .section-title {
      margin-bottom: 15px;
      font-size: 22px;
    }

    .matches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
    }

    .match {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      color: #6b7280;
      font-size: 14px;
    }

    .live {
      color: #dc2626;
      font-weight: bold;
    }

    .teams {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.8;
    }

    .score {
      float: right;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: center;
      gap: 35px;
      padding: 13px;
      z-index: 20;
    }

    .bottom-nav button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #374151;
    }

    @media (max-width: 600px) {
      .header-content {
        flex-direction: column;
        align-items: stretch;
      }

      .search {
        width: 100%;
      }

      .hero h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">Sport<span>Hub</span></div>
    <input class="search" type="text" placeholder="Cerca sport, squadra, atleta...">
  </div>
</header>

<main>

  <section class="hero">
    <h1>Tutto lo sport in un'unica app</h1>
    <p>Risultati, partite, classifiche e atleti.</p>
  </section>

  <h2 class="section-title">Scegli uno sport</h2>

  <section class="sports">
    <button class="sport active">⚽ Calcio</button>
    <button class="sport">🏀 Basket</button>
    <button class="sport">🎾 Tennis</button>
    <button class="sport">🏎️ Formula 1</button>
    <button class="sport">🏈 Football</button>
    <button class="sport">⚾ Baseball</button>
    <button class="sport">🏒 Hockey</button>
    <button class="sport">🏐 Volley</button>
    <button class="sport">🥊 Boxe</button>
    <button class="sport">🏉 Rugby</button>
    <button class="sport">⛳ Golf</button>
    <button class="sport">🏊 Nuoto</button>
  </section>

  <h2 class="section-title">Partite in evidenza</h2>

  <section class="matches">

    <div class="match">
      <div class="match-top">
        <span>Calcio</span>
        <span class="live">● LIVE</span>
      </div>

      <div class="teams">
        Squadra A <span class="score">1</span><br>
        Squadra B <span class="score">0</span>
      </div>
    </div>

    <div class="match">
      <div class="match-top">
        <span>Basket</span>
        <span>20:30</span>
      </div>

      <div class="teams">
        Team A <span class="score">-</span><br>
        Team B <span class="score">-</span>
      </div>
    </div>

    <div class="match">
      <div class="match-top">
        <span>Tennis</span>
        <span>21:00</span>
      </div>

      <div class="teams">
        Giocatore A <span class="score">-</span><br>
        Giocatore B <span class="score">-</span>
      </div>
    </div>

  </section>

</main>

<nav class="bottom-nav">
  <button>🏠 Home</button>
  <button>🔴 Live</button>
  <button>🏆 Classifiche</button>
  <button>⭐ Preferiti</button>
  <button>👤 Profilo</button>
</nav>

<script>
  const sports = document.querySelectorAll(".sport");

  sports.forEach(button => {
    button.addEventListener("click", () => {
      sports.forEach(b => b.classList.remove("active"));
      button.classList.add("active");
    });
  });
</script>

</body>
</html>
